        </g>
        <g>
          <rect x="353.91" y="191" width="96.19" height="16" rx="4" class="c-mask"/>
          <text x="402" y="202" class="t-security" font-size="9" text-anchor="middle">destroyed early</text>
        </g>
        <g transform="translate(0 16)">
          <text x="40" y="604" class="t-primary" font-size="12" font-weight="650">Legend</text>
