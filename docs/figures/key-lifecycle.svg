        <path d="M 72 436 L 908 436" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="424" class="t-dim" font-size="10" font-weight="600">03 / Terminal</text>
        <path d="M 154 157 L 748 157" class="a-emphasis" stroke-width="2.2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 153 157 L 189 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 307 157 L 343 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 461 157 L 497 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 615 157 L 651 157" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 710 188 L 710 278" class="a-security" stroke-width="1.1" marker-end="url(#arrowhead-security)"/>
        <path d="M 773 307 L 799 307 Q 809 307 809 297 L 809 167 Q 809 157 799 157 L 769 157" class="a-dashed" stroke-width="1.1" marker-end="url(#arrowhead-dashed)"/>
