          <rect x="343" y="450" width="118" height="58" rx="7" class="c-security" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-security" transform="translate(444 456) scale(0.6875)">
            <circle cx="8" cy="8" r="5.3"/>
            <path d="m5.7 5.7 4.6 4.6m0-4.6-4.6 4.6"/>
          </g>
          <text x="402" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Rows lost</text>
          <text x="402" y="487" class="t-muted" font-size="8.5" text-anchor="middle">envelopes remain</text>
        </g>
        <g id="node-destroyed">
          <rect x="651" y="450" width="118" height="58" rx="7" class="c-mask"/>
          <rect x="651" y="450" width="118" height="58" rx="7" class="c-external" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-external" transform="translate(752 456) scale(0.6875)">
            <rect x="3" y="3" width="10" height="10" rx="2"/>
            <circle cx="8" cy="8" r="1.2" class="sigil-fill"/>
          </g>
          <text x="710" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Destroyed</text>
          <text x="710" y="487" class="t-muted" font-size="8.5" text-anchor="middle">key material gone</text>
        </g>
        <g>
          <rect x="142.20" y="111" width="57.60" height="16" rx="4" class="c-mask"/>
          <text x="171" y="122" class="t-backend" font-size="9" text-anchor="middle">activate</text>
        </g>
        <g>
          <rect x="285.18" y="111" width="79.65" height="16" rx="4" class="c-mask"/>
          <text x="325" y="122" class="t-backend" font-size="9" text-anchor="middle">newer active</text>
        </g>
        <g>
          <rect x="439.18" y="111" width="79.65" height="16" rx="4" class="c-mask"/>
          <text x="479" y="122" class="t-backend" font-size="9" text-anchor="middle">sweep starts</text>
        </g>
        <g>
          <rect x="601.44" y="111" width="63.11" height="16" rx="4" class="c-mask"/>
          <text x="633" y="122" class="t-backend" font-size="9" text-anchor="middle">none left</text>
        </g>
        <g>
          <rect x="683.96" y="191" width="52.09" height="16" rx="4" class="c-mask"/>
