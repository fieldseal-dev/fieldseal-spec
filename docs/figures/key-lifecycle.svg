          <g aria-hidden="true" class="semantic-sigil s-cloud" transform="translate(444 132) scale(0.6875)">
            <path d="M4 2.5h8M4 13.5h8M5 3c0 2.8 2 3.2 3 5-1 1.8-3 2.2-3 5M11 3c0 2.8-2 3.2-3 5 1 1.8 3 2.2 3 5"/>
