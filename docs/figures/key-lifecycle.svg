          <g aria-hidden="true" class="semantic-sigil s-cloud" transform="translate(756 284) scale(0.6875)">
            <path d="M4 2.5h8M4 13.5h8M5 3c0 2.8 2 3.2 3 5-1 1.8-3 2.2-3 5M11 3c0 2.8-2 3.2-3 5 1 1.8 3 2.2 3 5"/>
          </g>
          <text x="710" y="299" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Scheduled</text>
          <text x="710" y="315" class="t-muted" font-size="8.5" text-anchor="middle">delay window §8.2</text>
        </g>
        <g id="node-lost">
