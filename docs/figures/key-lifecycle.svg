        <path d="M 402 188 L 402 450" class="a-security" stroke-width="1.1" marker-end="url(#arrowhead-security)"/>
        <g id="node-created">
          <rect x="35" y="126" width="118" height="62" rx="7" class="c-mask"/>
          <rect x="35" y="126" width="118" height="62" rx="7" class="c-frontend" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(136 132) scale(0.6875)">
