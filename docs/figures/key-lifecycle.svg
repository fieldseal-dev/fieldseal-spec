          <text x="402" y="163" class="t-muted" font-size="8.5" text-anchor="middle">still a candidate</text>
        </g>
        <g id="node-sweep">
          <rect x="497" y="126" width="118" height="62" rx="7" class="c-mask"/>
          <rect x="497" y="126" width="118" height="62" rx="7" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-backend" transform="translate(598 132) scale(0.6875)">
            <path d="M2 8h3l1.5-3.5L9 12l1.6-4H14"/>
          </g>
