<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="540" viewBox="0 32 1060 540" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">Fieldseal at a Glance</title>
        <desc id="archify-diagram-description">Overview of the specification: two implementations in different languages, each an application and ORM adapter over a Fieldseal core, share one database row. Core A seals the encrypted column and writes the blind index; core B opens the same envelope and queries the same index. Both cores unwrap tenant keys from the KMS in warm(), and both must pass the same pinned test vectors.</desc>
