<svg xmlns="http://www.w3.org/2000/svg" width="964" height="454" viewBox="0 34 964 454" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">Fieldseal Read Path</title>
        <desc id="archify-diagram-description">Workflow of one encrypted-field read: recognize the envelope, check the decrypt allow-list, take candidate keys from the cache, verify the key commitment, open the AEAD; each gate has its own error.</desc>
        <style>
svg { --bg: #ffffff; --mask: #ffffff; --backend-fill: rgba(52, 211, 153, 0.18); --backend-stroke: #059669; --database-fill: rgba(167, 139, 250, 0.2); --database-stroke: #7c3aed; --security-fill: rgba(251, 113, 133, 0.15); --security-stroke: #e11d48; --lane-fill: rgba(248, 250, 252, 0.65); --lane-stroke: #cbd5e1; --text: #0f172a; --text-muted: #64748b; --text-dim: #94a3b8; --external-fill: rgba(148, 163, 184, 0.18); --external-stroke: #64748b; --arrow: #94a3b8; --arrow-emphasis: #059669; }
@media (prefers-color-scheme: dark) { svg { --bg: #0f1216; --mask: #0f1216; --backend-fill: rgba(6, 78, 59, 0.4); --backend-stroke: #34d399; --database-fill: rgba(76, 29, 149, 0.4); --database-stroke: #a78bfa; --security-fill: rgba(136, 19, 55, 0.4); --security-stroke: #fb7185; --lane-fill: rgba(15, 23, 42, 0.22); --lane-stroke: #334155; --text: #ffffff; --text-muted: #94a3b8; --text-dim: #64748b; --external-fill: rgba(30, 41, 59, 0.5); --external-stroke: #94a3b8; --arrow: #64748b; --arrow-emphasis: #34d399; } }
svg { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.bg { fill: var(--bg); }
.c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
.c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
.c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
.c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
.c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4,4; }
.c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6,6; }
.c-mask { fill: var(--mask); stroke: none; }
.t-primary { fill: var(--text); }
.t-muted { fill: var(--text-muted); }
.t-dim { fill: var(--text-dim); }
.t-backend { fill: var(--backend-stroke); }
.t-security { fill: var(--security-stroke); }
.t-database { fill: var(--database-stroke); }
.a-default { stroke: var(--arrow); fill: none; }
.a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
.a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5,5; }
.m-default { fill: var(--arrow); }
.m-emphasis { fill: var(--arrow-emphasis); }
.m-security { fill: var(--security-stroke); }
.m-dashed { fill: var(--database-stroke); }
.s-backend { color: var(--backend-stroke); }
.s-database { color: var(--database-stroke); }
.s-security { color: var(--security-stroke); }
.s-external { color: var(--external-stroke); }
.semantic-sigil { fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; }
.semantic-sigil .sigil-fill { fill: currentColor; stroke: none; }
