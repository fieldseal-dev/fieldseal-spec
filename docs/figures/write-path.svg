<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="512" viewBox="0 54 1080 512" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">Fieldseal Write Path (Django)</title>
        <desc id="archify-diagram-description">Sequence diagram of one encrypted-field write through the Django adapter: encrypt under a single-use record key, derive the blind index under the separate index key, and store both in one INSERT or UPDATE.</desc>
