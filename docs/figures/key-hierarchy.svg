<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 12 980 580" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description">
        <title id="archify-diagram-title">Fieldseal Key Hierarchy</title>
        <desc id="archify-diagram-description">Key hierarchy: a root KEK in the KMS wraps two sibling tenant keys, the DEK and the index key; the DEK derives a single-use record key per write that seals the envelope, and the index key derives a blind-index key per index that produces the truncated blind index.</desc>
        <style>
