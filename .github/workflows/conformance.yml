name: Conformance

on:
  push:
    branches: [main, dev]
    paths:
      - "core/**"
      - "vectors/**"
      - "tools/vector-gen/**"
      - "tools/ucd-gen/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "core/**"
      - "vectors/**"
      - "tools/vector-gen/**"
      - "tools/ucd-gen/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:
  schedule:
    # Nightly (docs/14 §2): a Node, OpenSSL or pip-dependency change altering
    # behavior is exactly the drift the cross job exists to catch.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain. Bump deliberately, not automatically.
  PYTHON_VERSION: "3.12"
  # >= 24.7.0: the TypeScript core's Argon2id backend is node:crypto's
  # argon2Sync, which first shipped there (core/typescript/README.md).
  NODE_VERSION: "24"

jobs:
  typescript-core:
    name: TypeScript core vs the pinned vector suite
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core/typescript/package-lock.json

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Typecheck and build
        run: npm run typecheck && npm run build

      - name: Run the suite (vectors, gates, totality, primitives, providers)
        run: npm test

      # Same harness code as the vitest run, emitted in the docs/14 §4 shape.
      # Exit status is non-zero on any failure or non-pass out-of-band entry.
      - name: Emit the conformance report
        run: npm run --silent vectors > ../../conformance-typescript.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-typescript
          path: conformance-typescript.json

  python-core:
    name: Python core vs the pinned vector suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the core and its test extras
        run: python -m pip install --disable-pip-version-check -c core/python/constraints-ci.txt -e "./core/python[argon2,dev]"

      - name: Run the suite
        run: python -m pytest core/python/tests -q

      # docs/14 §4 JSON on stdout, prose on stderr. Exit status is non-zero on
      # any failure or non-pass out-of-band entry. The parse step exists
      # because this file once captured a prose summary under a .json name.
      - name: Emit the conformance report
        run: |
          python core/python/tests/run_vectors.py > conformance-python.json
          python -c "import json; r = json.load(open('conformance-python.json')); print(r['summary'], sorted(r['pinned_decisions']))"

      # docs/14 §4: reports are uploaded as artifacts on every run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-python
          path: conformance-python.json

  vectors-reproducible:
    name: Vectors match a fresh generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the generator
        run: python -m pip install --disable-pip-version-check -c core/python/constraints-ci.txt -e ./tools/vector-gen

      # The generator is deterministic by construction -- no CSPRNG, no clock
      # (docs/08 §7). So a regenerated suite that differs from the committed
      # one means one of three things, all of which should fail the build: a
      # vector was hand-edited, the generator changed without its output being
      # regenerated, or a dependency changed a primitive underneath us.
      - name: Regenerate and diff
        run: |
          python -m fieldseal_vectorgen --out vectors
          if ! git diff --quiet -- vectors; then
            echo "::error::Committed vectors differ from a fresh generation."
            echo "Run: python -m fieldseal_vectorgen --out vectors"
            git diff --stat -- vectors
            git diff -- vectors/MANIFEST.json
            exit 1
          fi
          echo "Committed vectors match a fresh generation."

  unicode-tables:
    name: Vendored Unicode tables match the published UCD
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `nfc-casefold-v1` is pinned to one Unicode version (docs/09 §7.1) and
      # both cores read vendored tables rather than their runtime's. Those
      # tables are generated, so they must be provably the published UCD and
      # not something hand-edited: a single wrong folding entry is a silent
      # blind-index divergence, which is the failure mode the pin exists to
      # remove. Fetches the UCD rather than vendoring it -- the three source
      # files are larger than the tables they produce.
      - name: Regenerate from unicode.org and diff
        run: |
          python tools/ucd-gen/generate.py --download --check

  suite-integrity:
    name: Suite integrity invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # These are properties of the vector suite as published, independent of
      # any implementation, so they run without installing one.
      - name: Check manifest, hold-outs, and provisional labelling
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys

          root = pathlib.Path("vectors")
          m = json.loads((root / "MANIFEST.json").read_text("utf-8"))
          fail = []

          pinned = {f["path"] for f in m["files"]}
          held = {h["path"] for h in m.get("held_out", [])}

          # A file cannot be both vouched for and held out.
          overlap = pinned & held
          if overlap:
              fail.append(f"listed as both pinned and held out: {sorted(overlap)}")

          for entry in m["files"]:
              p = root / entry["path"]
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != entry["sha256"]:
                  fail.append(f"{entry['path']}: sha256 {got} != {entry['sha256']}")
              doc = json.loads(p.read_text("utf-8"))
              # The file's own status must agree with the manifest, because a
              # harness may load either one first.
              if doc.get("status") != "pinned":
                  fail.append(f"{entry['path']}: in MANIFEST.files but status={doc.get('status')!r}")

          # Support files (keys/) are hashed like a family and never run;
          # a harness that iterated one would find no vectors to run.
          for entry in m.get("support", []):
              p = root / entry["path"]
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != entry["sha256"]:
                  fail.append(f"{entry['path']}: sha256 {got} != {entry['sha256']}")
              if "vectors" in json.loads(p.read_text("utf-8")):
                  fail.append(f"{entry['path']}: a support file must not carry vectors")

          for entry in m.get("held_out", []):
              p = root / entry["path"]
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != entry["sha256"]:
                  fail.append(f"{entry['path']} (held out): sha256 {got} != {entry['sha256']}")
              doc = json.loads(p.read_text("utf-8"))
              if doc.get("status") != "held-out":
                  fail.append(f"{entry['path']}: held out but status={doc.get('status')!r}")
              for field in ("reason", "unblocks_when"):
                  if not entry.get(field):
                      fail.append(f"{entry['path']}: held out without {field}")

          # Spec §4.8: until Gate 0b closes, nothing may be published as a
          # frozen format. This guards against the label being dropped by
          # accident rather than by decision.
          if not m.get("provisional"):
              fail.append("MANIFEST.provisional is not true while suites are provisional")
          if not m["vector_suite_version"].endswith("-provisional"):
              fail.append(f"vector_suite_version {m['vector_suite_version']!r} lacks the -provisional suffix")

          for entry in m["files"]:
              doc = json.loads((root / entry["path"]).read_text("utf-8"))
              for v in doc["vectors"]:
                  sid = v.get("suite_id")
                  if sid and not sid.upper().startswith("0XFF"):
                      fail.append(f"{v['id']}: suite_id {sid} is outside the §4.8 provisional range")

          if fail:
              print("::error::suite integrity checks failed")
              for f in fail:
                  print(f"  - {f}")
              sys.exit(1)
          print(f"OK: {len(pinned)} pinned, {len(m.get('support', []))} support, {len(held)} held out, all provisional.")
          PY

  # docs/14 §3: the N x N cross-implementation job -- the one that matters.
  # Each implementation encrypts the shared corpus through its REAL
  # production path (runtime CSPRNG, no injection); every implementation
  # (self-pairs included, to split "producer broke" from "pair broke")
  # decrypts every producer's artifact and compares plaintext byte-exact.
  cross-produce:
    name: "cross: ${{ matrix.impl }} produces"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        impl: [python, typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.impl == 'python'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the Python core
        if: matrix.impl == 'python'
        run: python -m pip install --disable-pip-version-check -c core/python/constraints-ci.txt -e "./core/python[argon2]"
      - name: Produce (python)
        if: matrix.impl == 'python'
        run: python core/python/tests/cross_produce.py --out cross-python.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.impl == 'typescript'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core/typescript/package-lock.json
      - name: Install the TypeScript core
        if: matrix.impl == 'typescript'
        working-directory: core/typescript
        run: npm ci
      - name: Produce (typescript)
        if: matrix.impl == 'typescript'
        working-directory: core/typescript
        run: npm run --silent cross:produce -- --out ../../cross-typescript.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-${{ matrix.impl }}
          path: cross-${{ matrix.impl }}.json

  cross-consume:
    name: "cross: ${{ matrix.consumer }} decrypts every producer"
    runs-on: ubuntu-24.04
    needs: cross-produce
    strategy:
      fail-fast: false
      matrix:
        consumer: [python, typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cross-*
          merge-multiple: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.consumer == 'python'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the Python core
        if: matrix.consumer == 'python'
        run: python -m pip install --disable-pip-version-check -c core/python/constraints-ci.txt -e "./core/python[argon2]"
      - name: Consume every producer (python)
        if: matrix.consumer == 'python'
        run: python core/python/tests/cross_consume.py cross-python.json cross-typescript.json --verdict verdict-python.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.consumer == 'typescript'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core/typescript/package-lock.json
      - name: Install the TypeScript core
        if: matrix.consumer == 'typescript'
        working-directory: core/typescript
        run: npm ci
      - name: Consume every producer (typescript)
        if: matrix.consumer == 'typescript'
        working-directory: core/typescript
        run: npm run --silent cross:consume -- ../../cross-python.json ../../cross-typescript.json --verdict ../../verdict-typescript.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict-${{ matrix.consumer }}
          path: verdict-${{ matrix.consumer }}.json

  # Lint and strict typing for the Python core (the TypeScript job already
  # typechecks; ruff runs against the project [tool.ruff], never a user-level
  # config).
  python-lint:
    name: Python lint and strict typing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: python -m pip install --disable-pip-version-check -c core/python/constraints-ci.txt -e "./core/python[argon2,dev]"

      - name: ruff
        working-directory: core/python
        run: python -m ruff check src tests

      - name: mypy --strict
        working-directory: core/python
        run: python -m mypy src
