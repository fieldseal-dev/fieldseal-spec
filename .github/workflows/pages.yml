name: Build and deploy fieldseal.dev

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Build and link-check on pull requests too, without deploying. A link that
  # points at nothing should fail the PR that introduced it, not the deploy
  # that follows the merge.
  pull_request:
    paths:
      - "www/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin the toolchain. Bump deliberately, not automatically.
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable:
      # whoever controls the action repository can repoint v4 at different
      # code, and every workflow that trusts the tag runs it on the next
      # build. A SHA cannot be repointed. This is what OpenSSF Scorecard's
      # Pinned-Dependencies check looks for.
      #
      # The trailing comment records which release each SHA was at the time
      # of pinning -- it is documentation, not a constraint. To upgrade,
      # resolve the new tag to its SHA and change both:
      #   gh api repos/actions/checkout/commits/v4 --jq .sha
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # enableGitInfo needs history for lastmod

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Sync docs/ into the site
        run: python www/scripts/sync-docs.py

      # baseURL comes from www/hugo.toml (https://fieldseal.dev/), NOT from
      # configure-pages. steps.pages.outputs.base_url reflects whatever Pages
      # is configured with at build time -- before the custom domain is saved
      # that is the project URL, which bakes /fieldseal-spec/ into every asset
      # and link and silently breaks the site on the apex domain.
      - name: Build
        run: |
          hugo \
            --source www \
            --minify \
            --gc

      # Runs against the built HTML, so it sees the resolved href and the
      # anchors each page actually has. Internal links only -- third parties
      # 403 CI runners on bot suspicion and go down for their own reasons, and
      # a deploy that fails for either is a deploy that gets ignored.
      - name: Check internal links
        run: python www/scripts/check-links.py www/public

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./www/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
