name: Build and deploy fieldseal.dev

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin the toolchain. Bump deliberately, not automatically.
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # TODO before going public: pin these actions to full commit SHAs rather
      # than tags. OpenSSF Scorecard's Pinned-Dependencies check looks for this,
      # and a tag is mutable.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # enableGitInfo needs history for lastmod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Sync docs/ into the site
        run: python www/scripts/sync-docs.py

      - name: Build
        run: |
          hugo \
            --source www \
            --minify \
            --gc \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
