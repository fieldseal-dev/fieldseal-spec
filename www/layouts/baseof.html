<!DOCTYPE html>
<html lang="en">
{{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  {{ with site.Params.status }}
    <div class="banner" role="note">
      <strong>Status:</strong> {{ . }}
    </div>
  {{ end }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
